<c:grid-row>
  <c:grid-col col="8-md">
    <c:card border>
      <c:card-body>
        <c:p t:content="formSubmitted" />
        <c:p t:content="formSubmittedInfo" />
        <c:p t:content="thankYou" />
        <% if (!page.noLinks) { %>
        <c:list type="unstyled" margin="start-3">
          <c:list-item t:content="gotoHome" href="/" icon="house"/>
        </c:list>
        <% } %>
      </c:card-body>
    </c:card>
  </c:grid-col>
  <c:grid-col col="4-md">
    <c:card>
      <c:card-body>
        <c:heading t:content="ourAddress" type="5" />
        <!-- include sumba.partial:/layout/address.html -->
      </c:card-body>
    </c:card>
  </c:grid-col>
</c:grid-row>
